name: Build Android AAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Force Build
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        # Ejecutar script oficial de libzt para Android
        bash ./build.sh android-aar release
        
        # Si el script no creó el archivo en dist, buscarlo y copiarlo forzadamente
        mkdir -p dist
        find pkg/android -name "*.aar" -exec cp {} dist/ \;

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-release-aar
        path: dist/*.aar
