name: Build Android AAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04 # Usamos 22.04 porque es más estable para librerías nativas antiguas/complejas
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Critical Native Dependencies (SWIG & Rust)
      run: |
        sudo apt-get update
        # SWIG es OBLIGATORIO para compilar los puentes de Java (JNI) en libzt
        sudo apt-get install -y make cmake clang ninja-build swig
        
        # ZeroTier requiere Rust y los targets de Android para su motor de red
        rustup default stable
        rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

    - name: Build AAR Package
      run: |
        export ANDROID_HOME=${{ env.ANDROID_SDK_ROOT }}
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk | sort -V | tail -n 1)
        
        # El script de libzt a menudo busca esta variable específica
        export NDK_HOME=$ANDROID_NDK_HOME 
        
        chmod +x ./build.sh
        
        # Ejecutar la compilación nativa
        ./build.sh android-aar release

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libzt-release-aar
        path: '**/*.aar'
