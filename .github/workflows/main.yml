name: Build Android AAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Android Package
      run: |
        chmod +x ./build.sh
        # Intentamos la compilación estándar
        ./build.sh android-aar release || true
        
        # Si falló la ruta anterior, compilamos directamente con Gradle en la ruta de Android
        if [ -d "pkg/android" ]; then
          cd pkg/android
          ./gradlew assembleRelease
        fi
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

    - name: List all generated files for debugging
      run: find . -name "*.aar"

    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libzt-release-aar
        path: |
          **/*.aar
          pkg/android/app/build/outputs/aar/*.aar
          dist/**/*.aar
