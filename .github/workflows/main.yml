name: Build Android AAR
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Native Build Tools
      run: sudo apt-get update && sudo apt-get install -y make cmake clang ninja-build

    - name: Compile libzt and Build AAR
      run: |
        export ANDROID_HOME=${{ env.ANDROID_SDK_ROOT }}
        
        # Localizar la versión más reciente del NDK preinstalada en el servidor
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk | sort -V | tail -n 1)
        echo "Using NDK at: $ANDROID_NDK_HOME"
        
        # Ejecutar script oficial
        chmod +x ./build.sh
        ./build.sh android-aar release || echo "build.sh script ended, proceeding to Gradle fallback..."
        
        # Compilación explícita con Gradle inyectando el NDK
        cd pkg/android
        echo "ndk.dir=$ANDROID_NDK_HOME" > local.properties
        chmod +x gradlew
        ./gradlew assembleRelease --info --stacktrace
        
    - name: Upload AAR Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: libzt-release-aar
        path: '**/*.aar'
